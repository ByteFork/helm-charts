name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CR_VERSION: "1.7.0"

jobs:
  release:
    name: Package and publish charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install chart-releaser
        run: |
          curl -sLo cr.tgz "https://github.com/helm/chart-releaser/releases/download/v${CR_VERSION}/chart-releaser_${CR_VERSION}_linux_amd64.tar.gz"
          mkdir -p .cr-bin
          tar -xzf cr.tgz -C .cr-bin
          echo "$PWD/.cr-bin" >> "$GITHUB_PATH"
          rm cr.tgz

      - name: Build chart dependencies
        run: |
          for chart in charts/*/; do
            if grep -q '^dependencies:' "$chart/Chart.yaml" 2>/dev/null; then
              helm dependency build "$chart" --skip-refresh
            fi
          done

      - name: Package charts
        run: |
          mkdir -p .cr-release-packages
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm package "$chart" --destination .cr-release-packages
          done
          ls -la .cr-release-packages

      - name: Upload charts to GitHub Releases
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cr upload \
            --owner "${{ github.repository_owner }}" \
            --repo helm-charts \
            --packages-dir .cr-release-packages \
            --skip-existing \
            --token "$CR_TOKEN"

      - name: Update index.yaml on gh-pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cr index \
            --owner "${{ github.repository_owner }}" \
            --repo helm-charts \
            --packages-dir .cr-release-packages \
            --pages-branch gh-pages \
            --push \
            --token "$CR_TOKEN" \
            --charts-repo https://bytefork.github.io/helm-charts

      - name: Stage gh-pages assets
        run: |
          mkdir -p _pages
          [ -f README.md ] && cp README.md _pages/
          ls -la _pages

      - name: Publish gh-pages assets
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_pages
          keep_files: true
          enable_jekyll: true
          commit_message: "chore(pages): sync repo metadata"
