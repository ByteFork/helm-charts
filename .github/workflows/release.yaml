name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Package and publish charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Add chart repositories
        run: helm repo add bytefork https://bytefork.github.io/helm-charts

      - name: Build chart dependencies
        run: |
          for chart in charts/*/; do
            if grep -q '^dependencies:' "$chart/Chart.yaml" 2>/dev/null; then
              helm dependency build "$chart"
            fi
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR (OCI)
        if: hashFiles('.cr-release-packages/*.tgz') != ''
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for pkg in .cr-release-packages/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${owner}/charts"
          done
          helm registry logout ghcr.io

      - name: Stage gh-pages assets
        run: |
          mkdir -p _pages
          [ -f README.md ] && cp README.md _pages/
          [ -f artifacthub-repo.yml ] && cp artifacthub-repo.yml _pages/
          ls -la _pages

      - name: Publish gh-pages assets
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_pages
          keep_files: true
          enable_jekyll: true
          commit_message: "chore(pages): sync repo metadata"
